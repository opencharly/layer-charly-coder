charly-coder:
    candy:
        description: |-
            Metadata concept candy owning the charly-coder skills whose names have no namesake candy (coder/dev images). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the coder concept candy's skill entities are present and generated into the marketplace's coder/skills
              id: charly-coder-present
              context:
                - build
              command: "true"

kubernetes-layer-skill:
    skill:
        name: kubernetes-layer
        family: coder
        owner: charly-coder
        description: |-
            Kubernetes client tools: kubectl and Helm package manager.
            Use when working with Kubernetes, kubectl, or Helm charts.
